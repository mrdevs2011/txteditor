<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTextEditor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #e8e8e8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .editor-window {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    /* ===== LEFT SIDEBAR ===== */
    .sidebar {
      width: 220px;
      background: #f8f8f8;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 16px;
      color: #333;
      padding: 8px 4px 16px;
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: #4a6cf7;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .sidebar-btn {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: #444;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-btn:hover {
      background: #f0f4ff;
      border-color: #4a6cf7;
      color: #4a6cf7;
    }

    .sidebar-btn.active {
      background: #4a6cf7;
      color: white;
      border-color: #4a6cf7;
    }

    /* ===== MAIN AREA ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* Top Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid #e8e8e8;
      background: #fafafa;
    }

    .tool-btn {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 90px;
      text-align: center;
    }

    .tool-btn:hover {
      background: #f0f4ff;
      border-color: #4a6cf7;
      color: #4a6cf7;
    }

    .tool-btn.active {
      background: #4a6cf7;
      color: white;
      border-color: #4a6cf7;
    }

    /* Editor Area */
    .editor-area {
      flex: 1;
      padding: 24px 28px;
      overflow-y: auto;
    }

    #editor {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      line-height: 1.7;
      color: #222;
      resize: none;
      font-family: inherit;
      background: transparent;
    }

    #editor:empty:before {
      content: "Bu yerga yozishni boshlang...";
      color: #aaa;
    }

    /* Status bar */
    .status-bar {
      padding: 8px 20px;
      font-size: 12px;
      color: #888;
      border-top: 1px solid #eee;
      background: #fafafa;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="editor-window">
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">M</div>
        <span>MRTextEditor</span>
      </div>

      <button class="sidebar-btn active" onclick="setActive(this)">
        📄 Hujjatlar
      </button>
      <button class="sidebar-btn" onclick="setActive(this)">
        📁 Papkalar
      </button>
      <button class="sidebar-btn" onclick="setActive(this)">
        ⚙️ Sozlamalar
      </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
      <!-- TOP TOOLBAR -->
      <div class="toolbar">
        <button class="tool-btn" onclick="format('bold')" title="Qalin">
          <b>B</b> Qalin
        </button>
        <button class="tool-btn" onclick="format('italic')" title="Kursiv">
          <i>I</i> Kursiv
        </button>
        <button class="tool-btn" onclick="format('underline')" title="Tagiga chizish">
          <u>U</u> Tagiga
        </button>
      </div>

      <!-- EDITOR -->
      <div class="editor-area">
        <div id="editor" contenteditable="true" spellcheck="true"></div>
      </div>

      <!-- STATUS -->
      <div class="status-bar">
        <span id="word-count">0 so'z</span>
        <span>MRTextEditor • Tayyor</span>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const wordCountEl = document.getElementById('word-count');

    // Format commands
    function format(command) {
      document.execCommand(command, false, null);
      editor.focus();
    }

    // Sidebar active state
    function setActive(btn) {
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Word count
    function updateWordCount() {
      const text = editor.innerText.trim();
      const words = text ? text.split(/\s+/).length : 0;
      wordCountEl.textContent = words + " so'z";
    }

    editor.addEventListener('input', updateWordCount);
    editor.addEventListener('keyup', updateWordCount);

    // Focus on load
    window.onload = () => {
      editor.focus();
    };
  </script>
</body>
</html>
