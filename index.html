<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTextEditor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px;
      background: #252526;
      border-right: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    .sidebar-header span {
      width: 18px;
      height: 18px;
      background: #007acc;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
    }

    .sidebar-items {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 13px;
      color: #cccccc;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sidebar-btn:hover {
      background: #2a2d2e;
    }

    .sidebar-btn.active {
      background: #37373d;
      border-color: #007acc;
      color: #ffffff;
    }

    /* ===== MAIN AREA ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Toolbar */
    .toolbar {
      height: 42px;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
    }

    .tool-btn {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 12px;
      color: #cccccc;
      cursor: pointer;
      transition: all 0.15s;
      height: 28px;
    }

    .tool-btn:hover {
      background: #4a4a4a;
      border-color: #007acc;
      color: #fff;
    }

    .tool-btn.active {
      background: #007acc;
      border-color: #007acc;
      color: #fff;
    }

    /* Editor + Preview split */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3c3c3c;
      min-width: 0;
    }

    .editor-header {
      height: 32px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #858585;
    }

    #editor {
      flex: 1;
      width: 100%;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      outline: none;
      padding: 16px 18px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      tab-size: 2;
    }

    /* Preview */
    .preview-pane {
      width: 42%;
      min-width: 280px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #3c3c3c;
    }

    .preview-header {
      height: 32px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #858585;
      letter-spacing: 0.5px;
    }

    #preview {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      color: #d4d4d4;
    }

    #preview h1, #preview h2, #preview h3 {
      color: #ffffff;
      margin: 1.2em 0 0.5em;
    }

    #preview h1 { font-size: 1.8em; border-bottom: 1px solid #3c3c3c; padding-bottom: 0.3em; }
    #preview h2 { font-size: 1.4em; }
    #preview h3 { font-size: 1.2em; }

    #preview p {
      margin-bottom: 1em;
    }

    #preview code {
      background: #2d2d2d;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: Consolas, monospace;
      font-size: 0.9em;
    }

    #preview pre {
      background: #2d2d2d;
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0;
    }

    #preview pre code {
      background: none;
      padding: 0;
    }

    #preview ul, #preview ol {
      padding-left: 1.6em;
      margin-bottom: 1em;
    }

    #preview a {
      color: #4fc1ff;
    }

    #preview blockquote {
      border-left: 4px solid #007acc;
      padding-left: 14px;
      color: #999;
      margin: 1em 0;
    }

    /* Status bar */
    .status-bar {
      height: 24px;
      background: #007acc;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-bar span {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>M</span>
        MRTextEditor
      </div>
      <div class="sidebar-items">
        <button class="sidebar-btn active" onclick="setActive(this)">Documents</button>
        <button class="sidebar-btn" onclick="setActive(this)">Folders</button>
        <button class="sidebar-btn" onclick="setActive(this)">Settings</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- Toolbar -->
      <div class="toolbar">
        <button class="tool-btn" onclick="insertMarkdown('**', '**')">Bold</button>
        <button class="tool-btn" onclick="insertMarkdown('*', '*')">Italic</button>
        <button class="tool-btn" onclick="insertMarkdown('`', '`')">Code</button>
        <button class="tool-btn" onclick="insertMarkdown('# ', '')">Heading</button>
      </div>

      <div class="content">
        <!-- Editor -->
        <div class="editor-pane">
          <div class="editor-header">editor.md</div>
          <textarea id="editor" placeholder="Write something..." spellcheck="false"></textarea>
        </div>

        <!-- Preview -->
        <div class="preview-pane">
          <div class="preview-header">PREVIEW</div>
          <div id="preview"></div>
        </div>
      </div>

      <!-- Status -->
      <div class="status-bar">
        <span id="word-count">0 words</span>
        <span>Markdown • UTF-8</span>
        <span>MRTextEditor</span>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const wordCountEl = document.getElementById('word-count');

    // Simple Markdown → HTML converter
    function markdownToHtml(md) {
      let html = md
        // Code blocks
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Headers
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Bold & Italic
        .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        // Blockquotes
        .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
        // Lists
        .replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>')
        // Paragraphs
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');

      // Wrap list items
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');

      return '<p>' + html + '</p>';
    }

    function updatePreview() {
      const text = editor.value;
      preview.innerHTML = markdownToHtml(text);

      // Word count
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordCountEl.textContent = words + ' words';
    }

    // Insert markdown syntax
    function insertMarkdown(before, after) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const selected = editor.value.substring(start, end);
      const newText = before + selected + after;

      editor.value = editor.value.substring(0, start) + newText + editor.value.substring(end);
      editor.focus();
      editor.selectionStart = editor.selectionEnd = start + before.length + selected.length + after.length;
      updatePreview();
    }

    // Sidebar active state
    function setActive(btn) {
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Live update
    editor.addEventListener('input', updatePreview);

    // Tab support
    editor.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        this.value = this.value.substring(0, start) + '  ' + this.value.substring(this.selectionEnd);
        this.selectionStart = this.selectionEnd = start + 2;
        updatePreview();
      }
    });

    // Initial content
    editor.value = `# Welcome to MRTextEditor

This is a **live Markdown** editor with preview.

## Features
- Real-time preview
- Clean VS Code-like interface
- Basic Markdown support

### Try it
Write some text on the left and see the result on the right.

\`\`\`
console.log("Hello World");
\`\`\`

> This is a blockquote

- List item one
- List item two
`;

    updatePreview();
    editor.focus();
  </script>
</body>
</html>
