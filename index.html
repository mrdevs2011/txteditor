<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTextEditor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1e1e;
      color: #ccc;
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; height: 100vh; }

    .sidebar {
      width: 250px;
      background: #252526;
      border-right: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 18px; height: 18px;
      background: #007acc;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: white;
    }
    .sidebar-actions {
      padding: 10px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid #3c3c3c;
    }
    .action-btn {
      flex: 1;
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
    }
    .action-btn:hover {
      background: #4a4a4a;
      border-color: #007acc;
      color: #fff;
    }
    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
    }
    .file-item {
      padding: 7px 12px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
    }
    .file-item:hover { background: #2a2d2e; }
    .file-item.active {
      background: #37373d;
      color: #fff;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .toolbar {
      height: 42px;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }
    .tool-btn {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      height: 28px;
    }
    .tool-btn:hover {
      background: #4a4a4a;
      border-color: #007acc;
      color: #fff;
    }

    .content { flex: 1; display: flex; overflow: hidden; }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3c3c3c;
      min-width: 0;
    }
    .editor-header {
      height: 32px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #858585;
    }
    #editor {
      flex: 1;
      width: 100%;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      outline: none;
      padding: 16px 18px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.55;
      resize: none;
      tab-size: 2;
    }

    .preview-pane {
      width: 45%;
      min-width: 320px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #3c3c3c;
    }
    .preview-header {
      height: 32px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 12px;
      color: #858585;
    }
    #preview-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    .status-bar {
      height: 24px;
      background: #007acc;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">M</div>
        MRTextEditor
      </div>
      <div class="sidebar-actions">
        <button class="action-btn" onclick="createFile()">New File</button>
        <button class="action-btn" onclick="runPreview()">Run</button>
      </div>
      <div class="file-tree" id="fileTree"></div>
    </div>

    <div class="main">
      <div class="toolbar">
        <button class="tool-btn" onclick="insertText('<!-- ', ' -->')">HTML Comment</button>
        <button class="tool-btn" onclick="insertText('/* ', ' */')">CSS/JS Comment</button>
        <button class="tool-btn" onclick="insertText('console.log(', ')')">console.log</button>
        <button class="tool-btn" onclick="runPreview()">Run Preview</button>
      </div>

      <div class="content">
        <div class="editor-pane">
          <div class="editor-header" id="currentFileName">index.html</div>
          <textarea id="editor" spellcheck="false"></textarea>
        </div>

        <div class="preview-pane">
          <div class="preview-header">
            <span>PREVIEW</span>
            <span style="font-size:11px;opacity:0.7">Saved in localStorage</span>
          </div>
          <iframe id="preview-frame"></iframe>
        </div>
      </div>

      <div class="status-bar">
        <span id="file-info">index.html</span>
        <span>HTML / CSS / JS + CDN</span>
        <span>MRTextEditor</span>
      </div>
    </div>
  </div>

  <script>
    // ===================== DEFAULT FILES =====================
    const defaultFiles = {
      "index.html": {
        type: "file",
        content: `<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Project</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <h1 class="text-3xl font-bold text-slate-800">Hello from MRTextEditor</h1>
</body>
</html>`
      }
    };

    let fileSystem = {};
    let currentFile = "index.html";

    const editor = document.getElementById('editor');
    const iframe = document.getElementById('preview-frame');

    // ===================== LOCAL STORAGE =====================
    function saveToStorage() {
      // Hozirgi fayl kontentini ham saqlaymiz
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }
      localStorage.setItem('mrtexteditor-files', JSON.stringify(fileSystem));
      localStorage.setItem('mrtexteditor-current', currentFile);
    }

    function loadFromStorage() {
      const saved = localStorage.getItem('mrtexteditor-files');
      if (saved) {
        try {
          fileSystem = JSON.parse(saved);
          const lastFile = localStorage.getItem('mrtexteditor-current');
          if (lastFile && fileSystem[lastFile]) {
            currentFile = lastFile;
          } else {
            currentFile = Object.keys(fileSystem)[0] || "index.html";
          }
          return true;
        } catch (e) {
          console.error("localStorage o'qishda xato:", e);
        }
      }
      // Agar saqlangan narsa bo'lmasa - default
      fileSystem = JSON.parse(JSON.stringify(defaultFiles));
      currentFile = "index.html";
      return false;
    }

    // ===================== FILE TREE =====================
    function renderFileTree() {
      const tree = document.getElementById('fileTree');
      tree.innerHTML = '';
      Object.keys(fileSystem).sort().forEach(name => {
        const el = document.createElement('div');
        el.className = 'file-item' + (name === currentFile ? ' active' : '');
        el.textContent = name;
        el.onclick = () => openFile(name);
        tree.appendChild(el);
      });
    }

    function createFile() {
      const name = prompt("Fayl nomi (masalan: style.css, app.js, page.html):");
      if (!name || !name.trim()) return;
      if (fileSystem[name]) return alert("Fayl allaqachon mavjud!");

      let content = "";
      if (name.endsWith('.html')) {
        content = `<!DOCTYPE html>\n<html>\n<head>\n  <title>New Page</title>\n</head>\n<body>\n  \n</body>\n</html>`;
      } else if (name.endsWith('.css')) {
        content = `/* ${name} */\n`;
      } else if (name.endsWith('.js')) {
        content = `// ${name}\n`;
      }

      fileSystem[name] = { type: "file", content };
      openFile(name);
      saveToStorage();
      renderFileTree();
    }

    function openFile(path) {
      // Avvalgi faylni saqlaymiz
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }

      currentFile = path;
      editor.value = fileSystem[path].content || "";
      document.getElementById('currentFileName').textContent = path;
      document.getElementById('file-info').textContent = path;

      saveToStorage();
      updatePreview();
      renderFileTree();
      editor.focus();
    }

    // ===================== PREVIEW =====================
    function buildPreview() {
      let html = "";

      if (currentFile.endsWith('.html')) {
        html = editor.value;
      } else if (fileSystem["index.html"]) {
        html = fileSystem["index.html"].content;
      } else {
        // Birinchi topilgan HTML
        for (const name of Object.keys(fileSystem)) {
          if (name.endsWith('.html')) {
            html = fileSystem[name].content;
            break;
          }
        }
      }

      if (!html) {
        return `<html><body style="font-family:sans-serif;padding:40px;color:#666">
          <h2>HTML fayl topilmadi</h2>
          <p>index.html yarating</p>
        </body></html>`;
      }

      // Local CSS
      html = html.replace(
        /<link[^>]+href=["']([^"']+\.css)["'][^>]*>/gi,
        (match, href) => {
          if (href.startsWith('http')) return match;
          const file = fileSystem[href];
          return file ? `<style>\n/* ${href} */\n${file.content}\n</style>` : match;
        }
      );

      // Local JS
      html = html.replace(
        /<script[^>]+src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi,
        (match, src) => {
          if (src.startsWith('http')) return match;
          const file = fileSystem[src];
          return file ? `<script>\n// ${src}\n${file.content}\n<\/script>` : match;
        }
      );

      return html;
    }

    function updatePreview() {
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }
      iframe.srcdoc = buildPreview();
      saveToStorage(); // har o'zgarishda saqlaymiz
    }

    function runPreview() {
      updatePreview();
    }

    function insertText(before, after = '') {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const selected = editor.value.substring(start, end);
      editor.value = editor.value.substring(0, start) + before + selected + after + editor.value.substring(end);
      editor.focus();
      editor.selectionStart = editor.selectionEnd = start + before.length + selected.length + after.length;
      updatePreview();
    }

    // ===================== EVENTS =====================
    editor.addEventListener('input', () => {
      updatePreview();
    });

    editor.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        this.value = this.value.substring(0, start) + '  ' + this.value.substring(this.selectionEnd);
        this.selectionStart = this.selectionEnd = start + 2;
        updatePreview();
      }
    });

    // Sahifa yopilishidan oldin saqlash
    window.addEventListener('beforeunload', saveToStorage);

    // ===================== INIT =====================
    loadFromStorage();
    renderFileTree();
    openFile(currentFile);
  </script>
</body>
</html>
