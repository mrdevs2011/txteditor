<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTextEditor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: #252526;
      border-right: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header .logo {
      width: 18px;
      height: 18px;
      background: #007acc;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
    }

    .sidebar-actions {
      padding: 10px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid #3c3c3c;
    }

    .action-btn {
      flex: 1;
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      transition: 0.15s;
    }

    .action-btn:hover {
      background: #4a4a4a;
      border-color: #007acc;
      color: #fff;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
    }

    .file-item, .folder-item {
      padding: 7px 12px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
      user-select: none;
    }

    .file-item:hover, .folder-item:hover {
      background: #2a2d2e;
    }

    .file-item.active {
      background: #37373d;
      color: #fff;
    }

    .folder-item {
      color: #e8ab53;
      font-weight: 500;
    }

    .file-item {
      color: #cccccc;
      padding-left: 28px;
    }

    .folder-content {
      display: none;
      padding-left: 12px;
    }

    .folder-item.open + .folder-content {
      display: block;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .toolbar {
      height: 42px;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .tool-btn {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
      height: 28px;
    }

    .tool-btn:hover {
      background: #4a4a4a;
      border-color: #007acc;
      color: #fff;
    }

    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3c3c3c;
      min-width: 0;
    }

    .editor-header {
      height: 32px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #858585;
    }

    #editor {
      flex: 1;
      width: 100%;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      outline: none;
      padding: 16px 18px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
    }

    .preview-pane {
      width: 42%;
      min-width: 280px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #3c3c3c;
    }

    .preview-header {
      height: 32px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #858585;
      letter-spacing: 0.5px;
    }

    #preview {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      color: #d4d4d4;
    }

    #preview h1 { font-size: 1.8em; color: #fff; border-bottom: 1px solid #3c3c3c; padding-bottom: 0.3em; margin: 1.2em 0 0.5em; }
    #preview h2 { font-size: 1.4em; color: #fff; margin: 1.2em 0 0.5em; }
    #preview h3 { font-size: 1.2em; color: #fff; margin: 1.2em 0 0.5em; }
    #preview p { margin-bottom: 1em; }
    #preview code { background: #2d2d2d; padding: 2px 6px; border-radius: 3px; font-family: Consolas, monospace; }
    #preview pre { background: #2d2d2d; padding: 14px; border-radius: 6px; overflow-x: auto; margin: 1em 0; }
    #preview pre code { background: none; padding: 0; }
    #preview ul, #preview ol { padding-left: 1.6em; margin-bottom: 1em; }
    #preview a { color: #4fc1ff; }
    #preview blockquote { border-left: 4px solid #007acc; padding-left: 14px; color: #999; margin: 1em 0; }

    .status-bar {
      height: 24px;
      background: #007acc;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">M</div>
        MRTextEditor
      </div>

      <div class="sidebar-actions">
        <button class="action-btn" onclick="createFolder()">New Folder</button>
        <button class="action-btn" onclick="createFile()">New File</button>
      </div>

      <div class="file-tree" id="fileTree"></div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="toolbar">
        <button class="tool-btn" onclick="insertMarkdown('**', '**')">Bold</button>
        <button class="tool-btn" onclick="insertMarkdown('*', '*')">Italic</button>
        <button class="tool-btn" onclick="insertMarkdown('`', '`')">Code</button>
        <button class="tool-btn" onclick="insertMarkdown('# ', '')">Heading</button>
      </div>

      <div class="content">
        <div class="editor-pane">
          <div class="editor-header" id="currentFileName">No file selected</div>
          <textarea id="editor" placeholder="Select or create a file..." spellcheck="false"></textarea>
        </div>

        <div class="preview-pane">
          <div class="preview-header">PREVIEW</div>
          <div id="preview"></div>
        </div>
      </div>

      <div class="status-bar">
        <span id="word-count">0 words</span>
        <span>Markdown • UTF-8</span>
        <span>MRTextEditor</span>
      </div>
    </div>
  </div>

  <script>
    // ============ FILE SYSTEM ============
    let fileSystem = {
      "Welcome.md": {
        type: "file",
        content: `# Welcome to MRTextEditor

This is a **real file system** simulation.

## Features
- Create folders and files
- Open multiple files
- Live Markdown preview
- Content is saved automatically when you switch files

### Try it
1. Click **New Folder** or **New File**
2. Click on any file to open it
3. Edit and switch between files

\`\`\`js
console.log("Hello from MRTextEditor");
\`\`\`
`
      }
    };

    let currentFile = "Welcome.md";
    let openFolders = new Set();

    // ============ RENDER FILE TREE ============
    function renderFileTree() {
      const tree = document.getElementById('fileTree');
      tree.innerHTML = '';

      // Group by folders
      const rootFiles = [];
      const folders = {};

      for (const [name, item] of Object.entries(fileSystem)) {
        if (item.type === "folder") {
          folders[name] = item;
        } else if (!name.includes('/')) {
          rootFiles.push(name);
        }
      }

      // Render folders first
      for (const folderName of Object.keys(folders).sort()) {
        const isOpen = openFolders.has(folderName);

        const folderEl = document.createElement('div');
        folderEl.className = 'folder-item' + (isOpen ? ' open' : '');
        folderEl.innerHTML = (isOpen ? '▼ ' : '▶ ') + folderName;
        folderEl.onclick = () => {
          if (openFolders.has(folderName)) {
            openFolders.delete(folderName);
          } else {
            openFolders.add(folderName);
          }
          renderFileTree();
        };
        tree.appendChild(folderEl);

        // Files inside this folder
        if (isOpen) {
          const content = document.createElement('div');
          content.className = 'folder-content';
          content.style.display = 'block';

          for (const [fullName, item] of Object.entries(fileSystem)) {
            if (item.type === "file" && fullName.startsWith(folderName + "/")) {
              const fileName = fullName.split('/').pop();
              const fileEl = document.createElement('div');
              fileEl.className = 'file-item' + (fullName === currentFile ? ' active' : '');
              fileEl.textContent = fileName;
              fileEl.onclick = (e) => {
                e.stopPropagation();
                openFile(fullName);
              };
              content.appendChild(fileEl);
            }
          }
          tree.appendChild(content);
        }
      }

      // Root files
      rootFiles.sort().forEach(name => {
        const fileEl = document.createElement('div');
        fileEl.className = 'file-item' + (name === currentFile ? ' active' : '');
        fileEl.textContent = name;
        fileEl.onclick = () => openFile(name);
        tree.appendChild(fileEl);
      });
    }

    // ============ CREATE FOLDER ============
    function createFolder() {
      const name = prompt("Folder name:");
      if (!name || !name.trim()) return;

      const folderName = name.trim();
      if (fileSystem[folderName]) {
        alert("Folder already exists!");
        return;
      }

      fileSystem[folderName] = { type: "folder" };
      openFolders.add(folderName);
      renderFileTree();
    }

    // ============ CREATE FILE ============
    function createFile() {
      const name = prompt("File name (example: notes.md):");
      if (!name || !name.trim()) return;

      let fileName = name.trim();
      if (!fileName.endsWith('.md') && !fileName.endsWith('.txt')) {
        fileName += '.md';
      }

      // Ask which folder (optional)
      const folder = prompt("Put inside folder? (leave empty for root):");
      let fullPath = fileName;

      if (folder && folder.trim()) {
        const folderName = folder.trim();
        if (!fileSystem[folderName] || fileSystem[folderName].type !== "folder") {
          // create folder if not exists
          fileSystem[folderName] = { type: "folder" };
          openFolders.add(folderName);
        }
        fullPath = folderName + "/" + fileName;
      }

      if (fileSystem[fullPath]) {
        alert("File already exists!");
        return;
      }

      fileSystem[fullPath] = {
        type: "file",
        content: `# ${fileName}\n\nStart writing here...\n`
      };

      openFile(fullPath);
      renderFileTree();
    }

    // ============ OPEN FILE ============
    function openFile(path) {
      // Save current file content first
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }

      currentFile = path;
      editor.value = fileSystem[path].content || "";
      document.getElementById('currentFileName').textContent = path;
      updatePreview();
      renderFileTree();
      editor.focus();
    }

    // ============ MARKDOWN & PREVIEW ============
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const wordCountEl = document.getElementById('word-count');

    function markdownToHtml(md) {
      let html = md
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/^\s*[-*] (.*$)/gim, '<li>$1</li>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');

      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      return '<p>' + html + '</p>';
    }

    function updatePreview() {
      const text = editor.value;
      preview.innerHTML = markdownToHtml(text);
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordCountEl.textContent = words + ' words';
    }

    function insertMarkdown(before, after) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const selected = editor.value.substring(start, end);
      editor.value = editor.value.substring(0, start) + before + selected + after + editor.value.substring(end);
      editor.focus();
      editor.selectionStart = editor.selectionEnd = start + before.length + selected.length + after.length;
      updatePreview();
    }

    // Auto-save on input
    editor.addEventListener('input', () => {
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }
      updatePreview();
    });

    // Tab support
    editor.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        this.value = this.value.substring(0, start) + '  ' + this.value.substring(this.selectionEnd);
        this.selectionStart = this.selectionEnd = start + 2;
        updatePreview();
      }
    });

    // Init
    renderFileTree();
    openFile("Welcome.md");
  </script>
</body>
</html>
