<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTextEditor</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --sidebar: #252526;
      --activity: #333333;
      --border: #3c3c3c;
      --text: #cccccc;
      --text-dim: #858585;
      --accent: #007acc;
      --tab-active: #1e1e1e;
      --tab-inactive: #2d2d2d;
      --hover: #2a2d2e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ===== ACTIVITY BAR ===== */
    .activity-bar {
      width: 48px;
      background: var(--activity);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      flex-shrink: 0;
      border-right: 1px solid #2b2b2b;
    }

    .activity-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #858585;
      cursor: pointer;
      position: relative;
      font-size: 22px;
    }

    .activity-icon.active {
      color: #ffffff;
    }

    .activity-icon.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--accent);
    }

    .activity-icon:hover {
      color: #ffffff;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-title {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .sidebar-actions {
      padding: 6px 10px 10px;
      display: flex;
      gap: 6px;
    }

    .action-btn {
      flex: 1;
      background: #3c3c3c;
      border: none;
      border-radius: 3px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
    }

    .action-btn:hover {
      background: #4a4a4a;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .file-item, .folder-item {
      padding: 5px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
    }

    .file-item:hover, .folder-item:hover {
      background: var(--hover);
    }

    .file-item.active {
      background: #37373d;
      color: #fff;
    }

    .folder-item {
      color: #e8ab53;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Tabs */
    .tabs {
      height: 35px;
      background: var(--tab-inactive);
      display: flex;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab {
      padding: 0 14px;
      height: 35px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--tab-inactive);
      border-right: 1px solid var(--border);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-dim);
      min-width: 120px;
      max-width: 180px;
      position: relative;
    }

    .tab.active {
      background: var(--tab-active);
      color: #fff;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--accent);
    }

    .tab-close {
      opacity: 0.6;
      font-size: 14px;
      margin-left: auto;
    }

    .tab-close:hover {
      opacity: 1;
      color: #f14c4c;
    }

    /* Editor + Preview */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
    }

    #editor {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: #d4d4d4;
      border: none;
      outline: none;
      padding: 12px 16px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      tab-size: 2;
    }

    .preview-pane {
      width: 42%;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }

    .preview-header {
      height: 35px;
      background: var(--tab-inactive);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: var(--text-dim);
      justify-content: space-between;
    }

    #preview-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: white;
    }

    /* Status Bar */
    .status-bar {
      height: 22px;
      background: var(--accent);
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      justify-content: space-between;
    }

    .status-left, .status-right {
      display: flex;
      gap: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ACTIVITY BAR -->
    <div class="activity-bar">
      <div class="activity-icon active" title="Explorer">📁</div>
      <div class="activity-icon" title="Search">🔍</div>
      <div class="activity-icon" title="Source Control">⎇</div>
      <div class="activity-icon" title="Extensions">⧉</div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-title">Explorer</div>
      <div class="sidebar-actions">
        <button class="action-btn" onclick="createFile()">New File</button>
        <button class="action-btn" onclick="createFolder()">New Folder</button>
      </div>
      <div class="file-tree" id="fileTree"></div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- TABS -->
      <div class="tabs" id="tabs"></div>

      <div class="content">
        <!-- EDITOR -->
        <div class="editor-pane">
          <textarea id="editor" spellcheck="false"></textarea>
        </div>

        <!-- PREVIEW -->
        <div class="preview-pane">
          <div class="preview-header">
            <span>PREVIEW</span>
            <span style="font-size:11px;opacity:0.7">Live</span>
          </div>
          <iframe id="preview-frame"></iframe>
        </div>
      </div>

      <!-- STATUS BAR -->
      <div class="status-bar">
        <div class="status-left">
          <span id="current-path">index.html</span>
          <span>UTF-8</span>
        </div>
        <div class="status-right">
          <span>HTML/CSS/JS</span>
          <span>MRTextEditor</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultFiles = {
      "index.html": {
        type: "file",
        content: `<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>My Project</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <h1 class="text-3xl font-bold text-slate-800">Hello VS Code style</h1>
</body>
</html>`
      }
    };

    let fileSystem = {};
    let openTabs = [];          // ochiq tablar
    let currentFile = null;
    let openFolders = new Set();

    const editor = document.getElementById('editor');
    const iframe = document.getElementById('preview-frame');

    // ========== STORAGE ==========
    function saveToStorage() {
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }
      localStorage.setItem('mrte-files', JSON.stringify(fileSystem));
      localStorage.setItem('mrte-tabs', JSON.stringify(openTabs));
      localStorage.setItem('mrte-current', currentFile || '');
    }

    function loadFromStorage() {
      const saved = localStorage.getItem('mrte-files');
      if (saved) {
        try {
          fileSystem = JSON.parse(saved);
          openTabs = JSON.parse(localStorage.getItem('mrte-tabs') || '[]');
          currentFile = localStorage.getItem('mrte-current') || null;

          // Filtrlash - mavjud bo'lmagan tablar
          openTabs = openTabs.filter(t => fileSystem[t]);
          if (currentFile && !fileSystem[currentFile]) currentFile = openTabs[0] || null;
          return;
        } catch(e) {}
      }
      fileSystem = JSON.parse(JSON.stringify(defaultFiles));
      openTabs = ["index.html"];
      currentFile = "index.html";
    }

    // ========== RENDER ==========
    function renderFileTree() {
      const tree = document.getElementById('fileTree');
      tree.innerHTML = '';

      const folders = {};
      const rootFiles = [];

      for (const name of Object.keys(fileSystem)) {
        if (fileSystem[name].type === 'folder') {
          folders[name] = true;
        } else if (!name.includes('/')) {
          rootFiles.push(name);
        }
      }

      // Folders
      Object.keys(folders).sort().forEach(folder => {
        const isOpen = openFolders.has(folder);
        const el = document.createElement('div');
        el.className = 'folder-item';
        el.innerHTML = `${isOpen ? '▼' : '▶'} ${folder}`;
        el.onclick = () => {
          isOpen ? openFolders.delete(folder) : openFolders.add(folder);
          renderFileTree();
        };
        tree.appendChild(el);

        if (isOpen) {
          Object.keys(fileSystem).forEach(full => {
            if (fileSystem[full].type === 'file' && full.startsWith(folder + '/')) {
              const fname = full.split('/').pop();
              const fileEl = document.createElement('div');
              fileEl.className = 'file-item' + (full === currentFile ? ' active' : '');
              fileEl.style.paddingLeft = '28px';
              fileEl.textContent = fname;
              fileEl.onclick = (e) => {
                e.stopPropagation();
                openFile(full);
              };
              tree.appendChild(fileEl);
            }
          });
        }
      });

      // Root files
      rootFiles.sort().forEach(name => {
        const el = document.createElement('div');
        el.className = 'file-item' + (name === currentFile ? ' active' : '');
        el.textContent = name;
        el.onclick = () => openFile(name);
        tree.appendChild(el);
      });
    }

    function renderTabs() {
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = '';

      openTabs.forEach(path => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (path === currentFile ? ' active' : '');
        tab.innerHTML = `
          <span>${path.split('/').pop()}</span>
          <span class="tab-close" onclick="closeTab(event, '${path}')">×</span>
        `;
        tab.onclick = (e) => {
          if (!e.target.classList.contains('tab-close')) openFile(path);
        };
        tabsEl.appendChild(tab);
      });
    }

    // ========== FILE OPERATIONS ==========
    function createFile() {
      const name = prompt("Fayl nomi (masalan: style.css yoki app.js):");
      if (!name || !name.trim()) return;
      if (fileSystem[name]) return alert("Allaqachon mavjud!");

      let content = '';
      if (name.endsWith('.html')) content = `<!DOCTYPE html>\n<html>\n<head>\n  <title>New</title>\n</head>\n<body>\n\n</body>\n</html>`;
      else if (name.endsWith('.css')) content = `/* ${name} */\n`;
      else if (name.endsWith('.js')) content = `// ${name}\n`;

      fileSystem[name] = { type: 'file', content };
      openFile(name);
      saveToStorage();
    }

    function createFolder() {
      const name = prompt("Folder nomi:");
      if (!name || !name.trim()) return;
      if (fileSystem[name]) return alert("Allaqachon mavjud!");
      fileSystem[name] = { type: 'folder' };
      openFolders.add(name);
      renderFileTree();
      saveToStorage();
    }

    function openFile(path) {
      // Save current
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }

      currentFile = path;

      if (!openTabs.includes(path)) {
        openTabs.push(path);
      }

      editor.value = fileSystem[path]?.content || '';
      document.getElementById('current-path').textContent = path;

      renderTabs();
      renderFileTree();
      updatePreview();
      saveToStorage();
      editor.focus();
    }

    function closeTab(e, path) {
      e.stopPropagation();
      openTabs = openTabs.filter(t => t !== path);

      if (currentFile === path) {
        currentFile = openTabs[openTabs.length - 1] || null;
        if (currentFile) {
          editor.value = fileSystem[currentFile].content || '';
          document.getElementById('current-path').textContent = currentFile;
        } else {
          editor.value = '';
          document.getElementById('current-path').textContent = '';
        }
      }

      renderTabs();
      renderFileTree();
      updatePreview();
      saveToStorage();
    }

    // ========== PREVIEW ==========
    function buildPreview() {
      let html = '';

      if (currentFile && currentFile.endsWith('.html')) {
        html = editor.value;
      } else if (fileSystem['index.html']) {
        html = fileSystem['index.html'].content;
      } else {
        for (const name of Object.keys(fileSystem)) {
          if (name.endsWith('.html')) {
            html = fileSystem[name].content;
            break;
          }
        }
      }

      if (!html) {
        return `<html><body style="font-family:sans-serif;padding:40px;color:#666">
          <h2>HTML fayl topilmadi</h2>
          <p>index.html yarating yoki oching</p>
        </body></html>`;
      }

      // Local CSS
      html = html.replace(/<link[^>]+href=["']([^"']+\.css)["'][^>]*>/gi, (m, href) => {
        if (href.startsWith('http')) return m;
        const f = fileSystem[href];
        return f ? `<style>\n/* ${href} */\n${f.content}\n</style>` : m;
      });

      // Local JS
      html = html.replace(/<script[^>]+src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi, (m, src) => {
        if (src.startsWith('http')) return m;
        const f = fileSystem[src];
        return f ? `<script>\n// ${src}\n${f.content}\n<\/script>` : m;
      });

      return html;
    }

    function updatePreview() {
      if (currentFile && fileSystem[currentFile]) {
        fileSystem[currentFile].content = editor.value;
      }
      iframe.srcdoc = buildPreview();
      saveToStorage();
    }

    // ========== EVENTS ==========
    editor.addEventListener('input', updatePreview);

    editor.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(editor.selectionEnd);
        editor.selectionStart = editor.selectionEnd = start + 2;
        updatePreview();
      }
    });

    window.addEventListener('beforeunload', saveToStorage);

    // ========== INIT ==========
    loadFromStorage();
    renderFileTree();
    renderTabs();

    if (currentFile) {
      editor.value = fileSystem[currentFile]?.content || '';
      document.getElementById('current-path').textContent = currentFile;
      updatePreview();
    }
  </script>
</body>
</html>
